name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      deploy-on: ${{ steps.npkg.outputs.deploy-on }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick tesseract-ocr

      - name: Install public test tools and project runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "https://github.com/tracecutter/npkglib/archive/refs/tags/v1.2.0.tar.gz"
          python -m pip install . \
            "pytest>=9.0.3" \
            "httpx2" \
            "ruff>=0.15.15" \
            "black<26.0,>=25.12.0" \
            "mypy<3,>=2.1.0"

      - name: Read npkg release policy
        id: npkg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)
          print(f"deploy-on={project.get('tool', {}).get('npkg', {}).get('web', {}).get('deploy-on', 'manual')}")
          PY

      - name: Run public-source checks
        timeout-minutes: 10
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          ruff check --no-cache .
          black --check --diff .
          mypy cdbr
          pytest -q

      - name: Build production container
        run: docker build --file Dockerfile --tag cdbr:release .

      - name: Health-check production container
        run: |
          name="cdbr-release-$RANDOM"
          docker run --detach --rm --name "$name" cdbr:release >/dev/null
          trap 'docker stop "$name" >/dev/null 2>&1 || true' EXIT INT TERM
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$name" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs "$name"
            exit 1
          fi

  deploy:
    name: Deploy to DigitalOcean
    needs: verify
    if: github.event_name == 'release' && needs.verify.outputs.deploy-on == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy released source
        env:
          DIGITALOCEAN_APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
        run: |
          test -n "$DIGITALOCEAN_APP_ID"
          doctl apps create-deployment "$DIGITALOCEAN_APP_ID" \
            --force-rebuild \
            --wait \
            --wait-timeout 30m
