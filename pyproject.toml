[project]
name = "cdbr"
version = "0.1.2"
description = "Code Break Puzzle Solver."
authors = [
  { name = "John Fogelin" }
]
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Topic :: Software Development :: Wordgame Solver",
  "Topic :: Utilities"
]

dependencies = [
    "click>=8.4.1",
    "packaging>=26.2",
    "npkglib>=1.1.0",
    "opencv-python-headless>=5.0.0.93",
    "wordfreq>=3.1.1",
    "Pillow>=12.0.0",
    "fastapi>=0.162.7",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    # configuration
	"npkg-pfig>=2.0.0",

    # docs
    "npkg-psym>=0.1.0",
    "sphinx<9.0,>=8.2.3",
    "myst-parser<5.0.0",
    "furo>=2025.12.19",
    # test
    "pytest>=9.0.3",
    "httpx2",
    # lint/style
    "ruff>=0.15.15",
    "black<26.0,>=25.12.0",
    # typing
    "mypy<3,>=2.1.0",
    # distribution
    "build>=1.5.0",
    "twine>=6.2.0",
]

[project.scripts]
cdbr = "cdbr.main:main"
cdbrd = "cdbr.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cdbr*"]

[tool.setuptools.package-data]
cdbr = [
    "_assets/**/*",
    "_assets/**/.*",
    "assets/**/*",
    "assets/**/.*",
]

[tool.ruff]
target-version = "py311"
lint.select = ["E", "F", "W", "B", "UP"]
lint.ignore = ["E501"]  # ← line length is a human concern

[tool.black]
line-length = 120 
target-version = ["py311"]
skip-string-normalization = true

[tool.mypy]
disable_error_code = ["annotation-unchecked"]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.npkg]
role = "tool"
type = "external"

[tool.npkg.web]
enabled = true
command = "cdbrd"
port = 8000
health-path = "/health"
container-file = "Dockerfile"
container-image = "ghcr.io/tracecutter/cdbr"
deploy-on = "release"

[tool.psym]
docs-dir = "docs"

[tool.cdbr]
sysdeps = [
  "git>=2.0",
  "imagemagick>=7.0",
  "make>=4.0",
  "tesseract>=5.0",
]

[[tool.cdbr.assets]]
label = "manpage"
share = "man"
section = "man1"
src = "docs/psym/_build/manpage/man1"
